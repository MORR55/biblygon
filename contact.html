<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакты</title>
  <link rel="icon" type="image/png" href="image/oko.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Unbounded', sans-serif;
      color: #e0e0e0;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('image/контакты.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    header button {
      background: none;
      border: 1px solid #a0ffe6;
      color: #a0ffe6;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Unbounded', cursive;
      transition: background 0.3s, box-shadow 0.4s ease-in-out, transform 0.3s;
    }

    header button:hover {
      background: rgba(160, 255, 230, 0.1);
      transform: scale(1.05);
      box-shadow: 0 0 12px #a0ffe6;
    }

    main {
      max-width: 800px;
      margin: 160px auto 60px;
      padding: 2rem;
      text-align: left;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.2rem;
      text-shadow: 0 0 20px #000;
    }

    .contacts a {
      display: block;
      margin: 1rem 0;
      font-size: 1.2rem;
      color: #a0ffe6;
      text-decoration: none;
      transition: color 0.3s;
    }

    .contacts a:hover {
      color: #fff;
      text-shadow: 0 0 10px #a0ffe6;
    }

    form {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    form input,
    form textarea {
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #a0ffe6;
      border-radius: 8px;
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      resize: none;
    }

    form button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #a0ffe6;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    form button:hover {
      background: #5fffd0;
    }

    footer {
      background: rgba(0, 0, 0, 0.85);
      color: #ccc;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 2rem;
    }

    footer img {
      width: 100px;
      transition: transform 1.6s ease-in-out;
      filter: invert(1) brightness(2);
      animation: floatPulse 4s ease-in-out infinite;
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.05); }
    }

    @media screen and (max-width: 768px) {
      h1 { font-size: 2rem; }
      header {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <button onclick="location.href='index.html'">Главная</button>
    <button onclick="location.href='explore.html'">Исследовать</button>
    <button onclick="location.href='ego.html'">Смерть Эго</button>
    <button onclick="location.href='contact.html'">Контакты</button>
  </header>

  <main>
    <h1>Свяжись со мной</h1>
    <div class="contacts">
      <a href="https://t.me/openuoyrmind" target="_blank">Telegram: @openuoyrmind</a>
      <a href="mailto:openyourmind920@gmail.com">Email: openyourmind920@gmail.com</a>
      <a href="https://github.com/MORR55" target="_blank">GitHub: github.com/MORR55</a>
    </div>
    <form>
      <input type="text" placeholder="Ваше имя" required />
      <input type="email" placeholder="Ваша почта" required />
      <textarea rows="5" placeholder="Ваше сообщение" required></textarea>
      <button type="submit">Отправить</button>
    </form>
  </main>

  <footer>
    <img src="image/oko.png" alt="Глаз" />
    <p>Открой свой разум</p>
  </footer>
</body>
</html>
