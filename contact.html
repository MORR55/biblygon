<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты</title>
  <link rel="icon" type="image/png" href="image/oko.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Unbounded', sans-serif;
      color: #e0e0e0;
      background: radial-gradient(ellipse at center, #0e0e0e 0%, #000000 100%);
      background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('image/контакты.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      touch-action: manipulation;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      transition: top 0.6s ease, opacity 0.6s ease;
      opacity: 1;
    }

    header.hide {
      top: -100px;
      opacity: 0;
    }

    header button {
      background: none;
      border: 1px solid #a0ffe6;
      color: #a0ffe6;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Unbounded', cursive;
      transition: background 0.3s, box-shadow 0.4s ease-in-out, transform 0.3s;
    }

    header button:hover {
      background: rgba(160, 255, 230, 0.1);
      transform: scale(1.05);
      box-shadow: 0 0 12px #a0ffe6;
    }

    main {
      max-width: 800px;
      margin: 160px auto 60px;
      padding: 2rem;
      text-align: left;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.2rem;
      text-shadow: 0 0 20px #000;
    }

    a {
      color: #a0ffe6;
      text-decoration: none;
      display: block;
      margin-bottom: 1rem;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #ffffff;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }

    input, textarea {
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-family: 'Unbounded', sans-serif;
    }

    input[type="submit"] {
      background-color: #a0ffe6;
      color: #000;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #7fffd4;
    }

    footer {
      background: rgba(0, 0, 0, 0.85);
      color: #ccc;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 2rem;
    }

    footer img {
      width: 100px;
      transition: transform 1.6s ease-in-out;
      filter: invert(1) brightness(2);
      animation: floatPulse 4s ease-in-out infinite;
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.05); }
    }

    @media screen and (max-width: 768px) {
      h1 { font-size: 2rem; }
      header {
        flex-direction: column;
        align-items: center;
        padding: 0.5rem 1rem;
      }

      header button {
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
      }

      main {
        margin: 140px auto 40px;
      }
    }

    @media screen and (max-width: 480px) {
      header {
        padding: 0.3rem 0.5rem;
        gap: 0.5rem;
      }

      header button {
        font-size: 0.75rem;
        padding: 0.3rem 0.6rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      main {
        padding: 1rem;
      }

      input, textarea {
        font-size: 0.9rem;
        padding: 0.5rem;
      }

      input[type="submit"] {
        font-size: 0.9rem;
        padding: 0.5rem;
      }

      footer img {
        width: 80px;
      }
    }
  </style>
</head>
<body>
  <header>
    <button onclick="location.href='index.html'">Главная</button>
    <button onclick="location.href='explore.html'">Исследовать</button>
    <button onclick="location.href='ego.html'">Смерть Эго</button>
  </header>

  <main>
    <h1>Контакты</h1>
    <a href="https://t.me/openuoyrmind" target="_blank">Telegram: @openuoyrmind</a>
    <a href="mailto:openyourmind920@gmail.com">Email: openyourmind920@gmail.com</a>
    <a href="https://github.com/MORR55" target="_blank">GitHub: MORR55</a>

    <form>
      <input type="text" placeholder="Ваше имя" required>
      <input type="email" placeholder="Ваш email" required>
      <textarea rows="5" placeholder="Ваше сообщение" required></textarea>
      <input type="submit" value="Отправить">
    </form>
  </main>

  <footer>
    <img src="image/oko.png" alt="Глаз">
    <p>Открой свой разум</p>
  </footer>

  <script>
    let lastScrollTop = 0;
    const header = document.querySelector("header");
    const delta = 10;

    window.addEventListener("scroll", () => {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;

      if (Math.abs(scrollTop - lastScrollTop) > delta) {
        if (scrollTop > lastScrollTop) {
          header.classList.add("hide");
        } else {
          header.classList.remove("hide");
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
      }
    });
  </script>
</body>
</html>
